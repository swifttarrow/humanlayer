services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humanlayer
      POSTGRES_PASSWORD: humanlayer
      POSTGRES_DB: humanlayer_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanlayer"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://humanlayer:humanlayer@db:5432/humanlayer_dev
      PORT: 3000
      LEASE_DURATION_SECONDS: 60
      LEASE_SWEEP_INTERVAL_MS: 30000
      NODE_ENV: production
      WORKDIR_ALLOWED_ROOTS: ${WORKDIR_ALLOWED_ROOTS:-/workspace,/tmp}
      RUNTIME_MODE: ${RUNTIME_MODE:-docker}
    command: >
      sh -c "npx prisma migrate deploy && node dist/apps/server/src/index.js"
    ports:
      - "3000:3000"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      SERVER_URL: http://server:3000
      AGENT_ID: docker-agent-1
      POLL_INTERVAL_MS: 5000
      HEARTBEAT_INTERVAL_MS: 15000
      AGENT_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      RUNTIME_MODE: docker
    volumes:
      - ${WORKSPACE_PATH:-./_workspace}:/workspace
    working_dir: /workspace
    # No ports — outbound-only
    read_only: true
    tmpfs:
      - /tmp:size=100M
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    depends_on:
      - server
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
