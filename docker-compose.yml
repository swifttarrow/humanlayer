services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humanlayer
      POSTGRES_PASSWORD: humanlayer
      POSTGRES_DB: humanlayer_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Default db name would match user (humanlayer); POSTGRES_DB is humanlayer_dev
      test: ["CMD-SHELL", "pg_isready -U humanlayer -d humanlayer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://humanlayer:humanlayer@db:5432/humanlayer_dev
      PORT: 3000
      LEASE_DURATION_SECONDS: 60
      LEASE_SWEEP_INTERVAL_MS: 30000
      NODE_ENV: production
      RUNTIME_MODE: docker
      RUNTIME_MODE_POLICY: docker_only
      SESSION_DEFAULT_WORKDIR: /workspace
      SESSION_WORKSPACE_ROOT: /workspace/sessions
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ${WORKSPACE_PATH:-./_workspace}:/workspace
    command: >
      sh -c "npx prisma migrate deploy && node dist/apps/server/src/index.js"
    ports:
      - "3000:3000"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      SERVER_URL: http://server:3000
      AGENT_ID: docker-agent-1
      POLL_INTERVAL_MS: 5000
      HEARTBEAT_INTERVAL_MS: 15000
      AGENT_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      RUNTIME_MODE: docker
      # npm install / create-react-app exceed the agent default 30s shell timeout
      SHELL_TIMEOUT_MS: "600000"
      # npm/npx on bind-mounted /workspace: tmpfs /tmp is often noexec → "Permission denied" on npx CLIs (exit 126)
      HOME: /workspace/.humanlayer-agent
      NPM_CONFIG_CACHE: /workspace/.humanlayer-agent/npm-cache
    volumes:
      - ${WORKSPACE_PATH:-./_workspace}:/workspace
    # Keep image WORKDIR (/app/apps/agent); do not set working_dir to /workspace or `node dist/...` resolves there.
    # No ports — outbound-only
    read_only: true
    # Large tmp for non-exec temp files; npx executables use HOME on /workspace (exec-capable)
    tmpfs:
      - /tmp:size=1g
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    depends_on:
      - server
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
