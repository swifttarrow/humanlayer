version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humanlayer
      POSTGRES_PASSWORD: humanlayer
      POSTGRES_DB: humanlayer_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanlayer"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://humanlayer:humanlayer@db:5432/humanlayer_dev
      PORT: 3000
      LEASE_DURATION_SECONDS: 60
      LEASE_SWEEP_INTERVAL_MS: 30000
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: >
      sh -c "cd apps/server && npx prisma migrate deploy && node dist/index.js"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      SERVER_URL: http://server:3000
      AGENT_ID: docker-agent-1
      POLL_INTERVAL_MS: 5000
      HEARTBEAT_INTERVAL_MS: 15000
      AGENT_MODEL: claude-haiku-4-5-20251001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
    # No ports — outbound-only
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    depends_on:
      - server
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
